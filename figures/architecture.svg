<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 716" width="760" height="716" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>The model architecture</title>
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7973}.grid{stroke:#e4e3df}.axis{stroke:#9c9b95}.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#c96f2a}.s2s{stroke:#c96f2a}.mute{fill:#c9c8c2}.tile{fill:#f1f0ec;stroke:#c9c8c2}.band{fill:#2a78d6;fill-opacity:.10}.on{fill:#ffffff}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.grid{stroke:#2e2e2b}.axis{stroke:#7a7973}.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#c96f2a}.s2s{stroke:#c96f2a}.mute{fill:#4a4945}.tile{fill:#262624;stroke:#4a4945}.band{fill:#3987e5;fill-opacity:.14}.on{fill:#ffffff}}</style>
<rect class="bg" width="760" height="716" rx="8"/>
<text class="t1" x="24.0" y="34.0" font-size="15.5" text-anchor="start" font-weight="600">The model: a six-block transformer that reads 256 characters and scores the next one</text>
<text class="t2" x="24.0" y="55.0" font-size="12.5" text-anchor="start">Shapes for one sequence; parameter count on the right, row by row</text>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="t3" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="tile" x="133.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="144.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">L</text>
<rect class="tile" x="159.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="170.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">o</text>
<rect class="tile" x="185.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="196.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">s</text>
<rect class="tile" x="211.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="222.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">␣</text>
<rect class="tile" x="237.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="248.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">p</text>
<rect class="tile" x="263.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="274.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">a</text>
<rect class="tile" x="289.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="300.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">d</text>
<rect class="tile" x="315.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="326.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">r</text>
<rect class="tile" x="341.0" y="74" width="22" height="22" rx="4"/>
<text class="t1" x="352.0" y="89.5" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">e</text>
<text class="t2" x="371.0" y="89.5" font-size="13" text-anchor="start">…</text>
<text class="t2" x="250.0" y="116.0" font-size="11.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">39 71 75 1 72 57 60 74 61 …</text>
<text class="t2" x="123.0" y="89.5" font-size="11.5" text-anchor="end">256 characters</text>
<text class="t2" x="123.0" y="116.0" font-size="11.5" text-anchor="end">256 integers</text>
<rect class="tile" x="100" y="136" width="140" height="46" rx="7"/>
<text class="t1" x="170.0" y="156.0" font-size="13" text-anchor="middle" font-weight="600">Token table</text>
<text class="t2" x="170.0" y="172.0" font-size="11.5" text-anchor="middle">122 × 256</text>
<rect class="tile" x="260" y="136" width="140" height="46" rx="7"/>
<text class="t1" x="330.0" y="156.0" font-size="13" text-anchor="middle" font-weight="600">Position table</text>
<text class="t2" x="330.0" y="172.0" font-size="11.5" text-anchor="middle">256 × 256</text>
<line class="axis" x1="170" y1="122" x2="170" y2="134" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="t3" x="330.0" y="129.0" font-size="10.5" text-anchor="middle">positions 0 … 255</text>
<path class="axis" d="M170,182 V200 H238" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
<path class="axis" d="M330,182 V200 H262" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
<circle class="bg" cx="250" cy="200" r="10"/>
<circle class="s1s" cx="250" cy="200" r="10" fill="none" stroke-width="2"/>
