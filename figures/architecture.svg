<line class="s1s" x1="250" y1="195" x2="250" y2="205" stroke-width="2"/>
<rect class="outline" x="84" y="228" width="332" height="214" rx="10" fill="none" stroke-dasharray="5 4" style="stroke:#9c9b95"/>
<text class="t1" x="404.0" y="430.0" font-size="12.5" text-anchor="end" font-weight="600">× 6 blocks</text>
<line class="s1s" x1="250" y1="210" x2="250" y2="218" stroke-width="3"/>
<path class="s1s" d="M250,218 H140 V472" fill="none" stroke-width="3"/>
<text class="t2" x="132.0" y="268.0" font-size="11" text-anchor="end">residual</text>
<text class="t2" x="132.0" y="282.0" font-size="11" text-anchor="end">stream</text>
<path class="axis" d="M140,258 H192" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
<rect class="tile" x="194" y="240" width="206" height="50" rx="7"/>
<text class="t1" x="297.0" y="262.0" font-size="13" text-anchor="middle" font-weight="600">Causal self-attention</text>
<text class="t2" x="297.0" y="278.0" font-size="11.5" text-anchor="middle">layer norm first · 8 heads of 32</text>
<path class="axis" d="M297,290 V312 H152" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
<circle class="bg" cx="140" cy="312" r="10"/>
<circle class="s1s" cx="140" cy="312" r="10" fill="none" stroke-width="2"/>
<line class="s1s" x1="135" y1="312" x2="145" y2="312" stroke-width="2"/>
<line class="s1s" x1="140" y1="307" x2="140" y2="317" stroke-width="2"/>
<path class="axis" d="M140,346 H192" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
<rect class="tile" x="194" y="328" width="206" height="50" rx="7"/>
<text class="t1" x="297.0" y="350.0" font-size="13" text-anchor="middle" font-weight="600">MLP</text>
<text class="t2" x="297.0" y="366.0" font-size="11.5" text-anchor="middle">layer norm first · 256, 1,024, 256</text>
<path class="axis" d="M297,378 V400 H152" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
<circle class="bg" cx="140" cy="400" r="10"/>
<circle class="s1s" cx="140" cy="400" r="10" fill="none" stroke-width="2"/>
<line class="s1s" x1="135" y1="400" x2="145" y2="400" stroke-width="2"/>
<line class="s1s" x1="140" y1="395" x2="140" y2="405" stroke-width="2"/>
<path class="s1s" d="M140,472 H236" fill="none" stroke-width="3"/>
<line class="axis" x1="236" y1="472" x2="238" y2="472" stroke-width="1.5" marker-end="url(#ah)"/>
<rect class="tile" x="240" y="454" width="160" height="36" rx="7"/>
<text class="t1" x="320.0" y="476.5" font-size="13" text-anchor="middle" font-weight="600">Final layer norm</text>
<line class="axis" x1="320" y1="490" x2="320" y2="506" stroke-width="1.5" marker-end="url(#ah)"/>
<rect class="tile" x="240" y="508" width="160" height="46" rx="7"/>
<text class="t1" x="320.0" y="528.0" font-size="13" text-anchor="middle" font-weight="600">Output head</text>
<text class="t2" x="320.0" y="544.0" font-size="11.5" text-anchor="middle">256 × 122</text>
<path class="s2s" d="M238,531 H74 Q60,531 60,517 V173 Q60,159 74,159 H98" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="t2" x="74.0" y="548.0" font-size="11" text-anchor="start">tied: the head reuses</text>
<text class="t2" x="74.0" y="562.0" font-size="11" text-anchor="start">the token table's weights</text>
<line class="axis" x1="320" y1="554" x2="320" y2="570" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="t2" x="250.0" y="586.0" font-size="11.5" text-anchor="middle">softmax: 122 probabilities for the next character</text>
<text class="t3" x="250.0" y="604.0" font-size="10.5" text-anchor="middle">after “Los␣padres␣” the trained model gives</text>
<path class="s1" d="M147.0,678.0 v-42.0 a4,4 0 0 1 4,-4 h14.0 a4,4 0 0 1 4,4 v42.0 z"/>
<text class="t1" x="158.0" y="692.0" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">n</text>
<text class="t2" x="158.0" y="628.0" font-size="10.5" text-anchor="middle">0.26</text>
<path class="mute" d="M193.0,678.0 v-26.4 a4,4 0 0 1 4,-4 h14.0 a4,4 0 0 1 4,4 v26.4 z"/>
<text class="t1" x="204.0" y="692.0" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">s</text>
<text class="t2" x="204.0" y="643.6" font-size="10.5" text-anchor="middle">0.17</text>
<path class="mute" d="M239.0,678.0 v-8.5 a4,4 0 0 1 4,-4 h14.0 a4,4 0 0 1 4,4 v8.5 z"/>
<text class="t1" x="250.0" y="692.0" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">y</text>
<text class="t2" x="250.0" y="661.5" font-size="10.5" text-anchor="middle">0.07</text>
<path class="mute" d="M285.0,678.0 v-7.8 a4,4 0 0 1 4,-4 h14.0 a4,4 0 0 1 4,4 v7.8 z"/>
<text class="t1" x="296.0" y="692.0" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">e</text>
<text class="t2" x="296.0" y="662.2" font-size="10.5" text-anchor="middle">0.07</text>
<path class="mute" d="M331.0,678.0 v-7.8 a4,4 0 0 1 4,-4 h14.0 a4,4 0 0 1 4,4 v7.8 z"/>
<text class="t1" x="342.0" y="692.0" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">d</text>
<text class="t2" x="342.0" y="662.2" font-size="10.5" text-anchor="middle">0.07</text>
<text class="t1" x="470.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="600">Parameters</text>
<line class="grid" x1="470" y1="80" x2="736" y2="80" stroke-width="1"/>
<text class="t2" x="470.0" y="159.0" font-size="11.5" text-anchor="start">token table</text>
<text class="t1" x="736.0" y="159.0" font-size="11.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">31,232</text>
<text class="t2" x="470.0" y="176.0" font-size="11.5" text-anchor="start">position table</text>
<text class="t1" x="736.0" y="176.0" font-size="11.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">65,536*</text>
<text class="t2" x="470.0" y="265.0" font-size="11.5" text-anchor="start">attention, 4 × 256²</text>
<text class="t1" x="736.0" y="265.0" font-size="11.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">262,144</text>
<text class="t2" x="470.0" y="353.0" font-size="11.5" text-anchor="start">MLP, 2 × 256 × 1,024</text>
<text class="t1" x="736.0" y="353.0" font-size="11.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">524,288</text>
<text class="t2" x="470.0" y="420.0" font-size="11.5" text-anchor="start">six blocks</text>
<text class="t1" x="736.0" y="420.0" font-size="11.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">4,718,592</text>
<text class="t2" x="470.0" y="476.0" font-size="11.5" text-anchor="start">layer norms (13 × 256)</text>
<text class="t1" x="736.0" y="476.0" font-size="11.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">3,328</text>
<text class="t2" x="470.0" y="535.0" font-size="11.5" text-anchor="start">output head (tied)</text>
<text class="t1" x="736.0" y="535.0" font-size="11.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">0</text>
<line class="axis" x1="470" y1="554" x2="736" y2="554" stroke-width="1"/>
<text class="t1" x="470.0" y="570.0" font-size="12" text-anchor="start" font-weight="600">total, as nanoGPT counts it</text>
<text class="t1" x="736.0" y="570.0" font-size="12" text-anchor="end" font-weight="600" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">4,753,152</text>
<text class="t3" x="470.0" y="590.0" font-size="10.5" text-anchor="start">* the position table is left out of the count</text>
</svg>
