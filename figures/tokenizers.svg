<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>Tokenizers compared on the corpus</title>
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7973}.grid{stroke:#e4e3df}.axis{stroke:#9c9b95}.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#c96f2a}.s2s{stroke:#c96f2a}.mute{fill:#c9c8c2}.tile{fill:#f1f0ec;stroke:#c9c8c2}.band{fill:#2a78d6;fill-opacity:.10}.on{fill:#ffffff}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.grid{stroke:#2e2e2b}.axis{stroke:#7a7973}.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#c96f2a}.s2s{stroke:#c96f2a}.mute{fill:#4a4945}.tile{fill:#262624;stroke:#4a4945}.band{fill:#3987e5;fill-opacity:.14}.on{fill:#ffffff}}</style>
<rect class="bg" width="760" height="300" rx="8"/>
<text class="t1" x="24.0" y="34.0" font-size="15.5" text-anchor="start" font-weight="600">A vocabulary learned on this text compresses it better than GPT-2's, at a fraction of the size</text>
<text class="t2" x="24.0" y="55.0" font-size="12.5" text-anchor="start">Measured on the 370,539-character validation split; embedding rows at the model's width of 256</text>
<text class="t1" x="24.0" y="107.0" font-size="12.5" text-anchor="start">Characters</text>
<text class="t1" x="24.0" y="141.0" font-size="12.5" text-anchor="start">SentencePiece, 1K</text>
<text class="t1" x="24.0" y="175.0" font-size="12.5" text-anchor="start">SentencePiece, 4K</text>
<text class="t1" x="24.0" y="209.0" font-size="12.5" text-anchor="start">SentencePiece, 8K</text>
<text class="t1" x="24.0" y="243.0" font-size="12.5" text-anchor="start">GPT-2 BPE (tiktoken)</text>
<text class="t2" x="200.0" y="78.0" font-size="12" text-anchor="start" font-weight="600">Characters per token</text>
<line class="axis" x1="200" y1="86" x2="200" y2="252" stroke-width="1"/>
<path class="s1" d="M200.0,94.0 h47.1 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-47.1 z"/>
<text class="t2" x="257.1" y="107.5" font-size="11.5" text-anchor="start">1.00</text>
<path class="s1" d="M200.0,128.0 h144.7 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-144.7 z"/>
<text class="t2" x="354.7" y="141.5" font-size="11.5" text-anchor="start">2.91</text>
<path class="s1" d="M200.0,162.0 h190.2 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-190.2 z"/>
<text class="t2" x="400.2" y="175.5" font-size="11.5" text-anchor="start">3.80</text>
<path class="s1" d="M200.0,196.0 h209.1 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-209.1 z"/>
<text class="t2" x="419.1" y="209.5" font-size="11.5" text-anchor="start">4.17</text>
<path class="s2" d="M200.0,230.0 h130.9 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-130.9 z"/>
<text class="t2" x="340.9" y="243.5" font-size="11.5" text-anchor="start">2.64</text>
<text class="t2" x="490.0" y="78.0" font-size="12" text-anchor="start" font-weight="600">Embedding parameters</text>
<line class="axis" x1="490" y1="86" x2="490" y2="252" stroke-width="1"/>
<path class="s1" d="M490.0,94.0 h1.5 a1.5,1.5 0 0 1 1.5,1.5 v15.0 a1.5,1.5 0 0 1 -1.5,1.5 h-1.5 z"/>
<text class="t2" x="499.0" y="107.5" font-size="11.5" text-anchor="start">31K</text>
<path class="s1" d="M490.0,128.0 h2.3 a2.2646153846153845,2.2646153846153845 0 0 1 2.2646153846153845,2.2646153846153845 v13.5 a2.2646153846153845,2.2646153846153845 0 0 1 -2.2646153846153845,2.2646153846153845 h-2.3 z"/>
<text class="t2" x="500.5" y="141.5" font-size="11.5" text-anchor="start">256K</text>
<path class="s1" d="M490.0,162.0 h14.1 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-14.1 z"/>
<text class="t2" x="514.1" y="175.5" font-size="11.5" text-anchor="start">1.0M</text>
<path class="s1" d="M490.0,196.0 h32.2 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-32.2 z"/>
<text class="t2" x="532.2" y="209.5" font-size="11.5" text-anchor="start">2.0M</text>
<path class="s2" d="M490.0,230.0 h223.6 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-223.6 z"/>
<text class="t2" x="723.6" y="243.5" font-size="11.5" text-anchor="start">12.9M</text>
<rect class="s1" x="24" y="271" width="10" height="10" rx="2"/>
<text class="t2" x="40.0" y="280.0" font-size="12" text-anchor="start">trained on the poet's own text</text>
<rect class="s2" x="278.0" y="271" width="10" height="10" rx="2"/>
<text class="t2" x="294.0" y="280.0" font-size="12" text-anchor="start">GPT-2's vocabulary, learned mostly on English</text>
</svg>
