<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>Training and validation loss</title>
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7973}.grid{stroke:#e4e3df}.axis{stroke:#9c9b95}.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#c96f2a}.s2s{stroke:#c96f2a}.mute{fill:#c9c8c2}.tile{fill:#f1f0ec;stroke:#c9c8c2}.band{fill:#2a78d6;fill-opacity:.10}.on{fill:#ffffff}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.grid{stroke:#2e2e2b}.axis{stroke:#7a7973}.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#c96f2a}.s2s{stroke:#c96f2a}.mute{fill:#4a4945}.tile{fill:#262624;stroke:#4a4945}.band{fill:#3987e5;fill-opacity:.14}.on{fill:#ffffff}}</style>
<rect class="bg" width="760" height="396" rx="8"/>
<text class="t1" x="24.0" y="34.0" font-size="15.5" text-anchor="start" font-weight="600">Loss on the posts the model never trains on, against the predictions made before training</text>
<text class="t2" x="24.0" y="55.0" font-size="12.5" text-anchor="start">Cross-entropy in nats per character, measured every 250 steps on 50 batches of each split</text>
<line class="grid" x1="60" y1="320.0" x2="610" y2="320.0" stroke-width="1"/>
<text class="t2" x="52.0" y="324.0" font-size="11" text-anchor="end">1.0</text>
<line class="grid" x1="60" y1="258.5" x2="610" y2="258.5" stroke-width="1"/>
<text class="t2" x="52.0" y="262.5" font-size="11" text-anchor="end">2.0</text>
<line class="grid" x1="60" y1="197.0" x2="610" y2="197.0" stroke-width="1"/>
<text class="t2" x="52.0" y="201.0" font-size="11" text-anchor="end">3.0</text>
<line class="grid" x1="60" y1="135.5" x2="610" y2="135.5" stroke-width="1"/>
<text class="t2" x="52.0" y="139.5" font-size="11" text-anchor="end">4.0</text>
<line class="grid" x1="60" y1="74.0" x2="610" y2="74.0" stroke-width="1"/>
<text class="t2" x="52.0" y="78.0" font-size="11" text-anchor="end">5.0</text>
<text class="t2" x="60.0" y="338.0" font-size="11" text-anchor="middle">0</text>
<text class="t2" x="151.7" y="338.0" font-size="11" text-anchor="middle">500</text>
<text class="t2" x="243.3" y="338.0" font-size="11" text-anchor="middle">1,000</text>
<text class="t2" x="335.0" y="338.0" font-size="11" text-anchor="middle">1,500</text>
<text class="t2" x="426.7" y="338.0" font-size="11" text-anchor="middle">2,000</text>
<text class="t2" x="518.3" y="338.0" font-size="11" text-anchor="middle">2,500</text>
<text class="t2" x="610.0" y="338.0" font-size="11" text-anchor="middle">3,000</text>
<line class="axis" x1="60" y1="320" x2="610" y2="320" stroke-width="1"/>
<text class="t2" x="335.0" y="358.0" font-size="11.5" text-anchor="middle">training step</text>
<rect class="band" x="60" y="286.2" width="550" height="12.3"/>
<text class="t2" x="602.0" y="296.3" font-size="11" text-anchor="end">predicted before training: 1.35–1.55</text>
<line class="axis" x1="60" y1="86.1" x2="610" y2="86.1" stroke-width="1" stroke-dasharray="3 3"/>
<text class="t2" x="618.0" y="90.1" font-size="11" text-anchor="start">ln 122 = 4.80</text>
<path class="s2s" d="M60.0,81.3 L105.8,245.7 L151.7,264.1 L197.5,280.2 L243.3,290.7 L289.2,296.6 L335.0,301.3 L380.8,303.6 L426.7,305.8 L472.5,308.0 L518.3,309.1 L564.2,310.3 L610.0,310.8" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s1s" d="M60.0,81.3 L105.8,245.4 L151.7,263.4 L197.5,279.0 L243.3,289.9 L289.2,295.6 L335.0,299.7 L380.8,302.5 L426.7,304.1 L472.5,305.6 L518.3,306.7 L564.2,307.7 L610.0,308.1" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="bg" cx="610.0" cy="310.8" r="6"/><circle class="s2" cx="610.0" cy="310.8" r="4"/>
<circle class="bg" cx="610.0" cy="308.1" r="6"/><circle class="s1" cx="610.0" cy="308.1" r="4"/>
<text class="t1" x="620.0" y="305.1" font-size="11.5" text-anchor="start">val 1.19</text>
<text class="t2" x="620.0" y="321.8" font-size="11.5" text-anchor="start">train 1.15</text>
<rect class="s1" x="60" y="377" width="10" height="10" rx="2"/>
<text class="t2" x="76.0" y="386.0" font-size="12" text-anchor="start">validation (posts held out)</text>
<rect class="s2" x="292.4" y="377" width="10" height="10" rx="2"/>
<text class="t2" x="308.4" y="386.0" font-size="12" text-anchor="start">training</text>
</svg>
